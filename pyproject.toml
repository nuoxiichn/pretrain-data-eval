[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretrain-data-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14",
    "tokenizers>=0.19",
    "pyyaml>=6",
    "numpy>=1.26",
    "xxhash>=3.4",
    "click>=8",
]

[project.optional-dependencies]
text = [
    "fasttext>=0.9.2",
    "langcodes>=3.3",
    "nltk>=3.8",
    "jieba>=0.42",
]
safety = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]
code = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-ruby>=0.21",
    "tree-sitter-php>=0.21",
]
benchmarks = [
    "datasets>=2.14",
]
license = [
    "scancode-toolkit>=32",
]
gpu = [
    "torch>=2.2",
    "transformers>=4.40",
    "ai2-olmo>=0.6,<0.7",
    "faiss-cpu>=1.7",
]
judge = [
    "vllm>=0.6",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.21",
    "ruff>=0.4",
]

# Gitleaks、语言模型、tokenizer 和推理权重需要单独准备。
# DataTrove MinHash 使用 envs/datatrove.txt 定义的独立环境。

[tool.hatch.build.targets.wheel]
packages = ["pretrain_data_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
