schema_version: 1
registry: configs/benchmark_registry.yaml

claim:
  scope: pretraining_data_recipe_ranking
  statement: >-
    在模型结构、tokenizer、优化器、训练 seed 和 token/parameter 预算固定时，
    小模型上的某个 benchmark 代理指标能否预测 1B 目标模型在同一能力上的数据 recipe 排序。
  exclusions:
    - 不把 benchmark 分数解释为数据总体质量
    - 不把 20M 到 1B 的结论外推到 3B 及以上
    - 不把基础模型代理直接外推到仅在 SFT 或 RLHF 后成立的指标

model_matrix:
  proxy_scales: [20M, 60M, 150M]
  target_scale: 1B
  seeds: [6198, 14, 15]
  final_token_parameter_ratio: 100
  local_budget_checkpoints: [17, 50, 100]
  fixed_within_comparison:
    - architecture
    - tokenizer
    - optimizer
    - batch
    - context_length
    - seed
    - token_budget

evaluation_contract:
  model_stage: base
  prompt_policy: 同一 benchmark 在所有 scale 使用完全相同的题干、选项顺序、shot 和答案前缀
  chat_template: forbidden
  chain_of_thought: disabled_unless_separately_preregistered
  target_protocol: 团队 base-model evaluator 的冻结协议；执行前必须补充 evaluator commit 和 task hash
  proxy_protocol: 从同一组模型输出重建候选连续指标，不另换更容易的题面
  invalid_example_policy: 缺题干、少于两个非空选项或答案越界时排除，并在 summary 记录 ID 与原因
  aggregation:
    - 学科型任务先做学科宏平均
    - 多语言任务先逐语言报告
    - 不把重叠子集当成独立样本

public_checkpoint_matrix:
  endpoint: https://hf-mirror.com
  model_cache_dir: /mnt/public/data/datadecide-benchmark-proxy/hf_models
  dataset_cache_dir: /mnt/public/data/datadecide-benchmark-proxy/hf_datasets
  protocol: rc-zero-shot-v1
  recipe_repositories:
    - c4
    - dclm-baseline
    - dclm-baseline-25p-dolma1.7-75p
    - dclm-baseline-50p-dolma1.7-50p
    - dclm-baseline-75p-dolma1.7-25p
    - dclm-baseline-qc-10p
    - dclm-baseline-qc-20p
    - dclm-baseline-qc-7p-fw2
    - dclm-baseline-qc-7p-fw3
    - dclm-baseline-qc-fw-10p
    - dclm-baseline-qc-fw-3p
    - dolma1_6plus
    - dolma1_7
    - dolma1_7-no-code
    - dolma1_7-no-flan
    - dolma1_7-no-math-code
    - dolma1_7-no-reddit
    - falcon
    - falcon-and-cc
    - falcon-and-cc-qc-10p
    - falcon-and-cc-qc-20p
    - falcon-and-cc-qc-orig-10p
    - falcon-and-cc-qc-tulu-10p
    - fineweb-edu
    - fineweb-pro
  model_repo_template: allenai/DataDecide-{recipe}-{scale}
  benchmark_specs:
    mmlu-pro:
      data_id: TIGER-Lab/MMLU-Pro
      revision: b189ec765aa7ed75c8acfea42df31fdae71f97be
      aggregation: macro_by_group
    gpqa-diamond:
      data_id: Idavidrein/gpqa
      data_subset: gpqa_diamond
      revision: 633f5ee89ab8ad4522a9f850766b73f62147ffdd
      aggregation: micro
    mmmlu:
      data_id: openai/MMMLU
      data_subset: ZH_CN
      revision: 325a01dc3e173cac1578df94120499aaca2e2504
      aggregation: macro_by_group
    mmlu-cf:
      data_id: microsoft/MMLU-CF
      revision: c25b89a968a2062e422dd96ddf0fe3387507f0dd
      aggregation: macro_by_group

evidence_phases:
  - name: target_resolution_audit
    purpose: 先确认 1B accuracy 能稳定区分 recipe，否则没有可供小模型预测的 target 排序
    recipes: DataDecide 全 25 recipe
    scale: 1B
    seed_policy: 优先三个公开 seed；default seed 只用于成本预估，不用于最终晋级
    failure_outcome: needs_larger_target
  - name: public_checkpoint_screen
    purpose: 不重新训练，先筛掉在小模型上无分辨率或明显不能跨尺度排序的 benchmark
    recipes: DataDecide 全 25 recipe
    recipe_families: DataDecide 全部公开 family
    proxy_scales: [20M, 60M, 150M]
    target_scale: 1B
    seed_policy: 先跑 default seed；只有候选指标有信号后再补齐三个公开 seed
    limitation: 通用网页 recipe 只能做低成本筛选，不能单独证明数学、代码专项数据的可迁移性
  - name: ability_specific_confirmation
    purpose: 用与能力匹配的数据变化确认筛选结果能够覆盖真实生产决策
    minimum_recipes: 8
    minimum_recipe_families: 3
    recipe_requirements:
      - 至少两个自然生产版本，不得只使用人工破坏的负对照
      - 包含明显边、临界边和可能 crossover 的边
      - 所有 recipe 保持相同 token 预算，能力数据通过等量替换而不是额外追加
      - 训练前完成 benchmark 污染和近重复审计
    proxy_scales: [20M, 60M, 150M]
    target_scale: 1B
    seed_policy: proxy 和 target 均优先三个训练 seed；若 target 只有历史单 seed，证据降级
    target_source_priority:
      - 团队已有且训练协议匹配的历史 1B checkpoint
      - 公开且训练数据 recipe 可解释的 1B checkpoint
      - 仅对前两项无法覆盖的关键 pair 新训练 1B anchor
    cost_control: 先用 20M/60M 预测 150M 做专项 pilot，通过后才支付新的 1B anchor 训练
  - name: heldout_confirmation
    purpose: 防止根据同一批 recipe 挑指标造成过拟合
    split_unit: recipe_family
    policy: 候选指标和阈值在开发 family 上确定，只在未参与选择的 family 上作最终裁决

decision_protocol:
  target_pair:
    decisive_when: 三个 target seed 同向，或 target 的 cluster bootstrap 区间不跨零
    ambiguous_action: 从正确率分母排除并单独报告，不把 target 噪声算作 proxy 错误
    insufficient_resolution_action: 若不足 20 个明确 pair，标为 needs_larger_target，不评价 proxy 成败
  proxy_pair:
    automatic_decision: 三个 proxy seed 同向且 margin 超过开发集阈值
    otherwise: abstain
  primary_statistics:
    - pairwise_decision_accuracy
    - abstention_coverage
    - conditional_accuracy_after_abstention
    - recipe_family_cluster_bootstrap_95ci
  secondary_statistics:
    - kendall_tau
    - per_seed_direction
    - score_margin
    - floor_or_ceiling_rate
  provisional_promotion_gates:
    minimum_recipes: 8
    minimum_recipe_families: 3
    minimum_decisive_pairs: 20
    minimum_target_normalized_lift_over_random: 0.05
    minimum_pairwise_accuracy: 0.80
    minimum_cluster_bootstrap_lower_bound: 0.65
    minimum_conditional_accuracy: 0.90
    minimum_abstention_coverage: 0.50
    minimum_worst_heldout_family_accuracy: 0.65
    require_no_known_systematic_crossover: true
    note: 这些是工程预注册门槛，不是论文给出的通用常数；首轮结果后只能用新 held-out family 修改
  outcomes:
    - validated_proxy
    - early_screen_only
    - needs_larger_proxy
    - needs_larger_target
    - rejected_proxy
    - blocked

benchmark_groups:
  knowledge_multiple_choice:
    ability: 通用知识、科学推理和多语言知识
    wave: 1
    target_metric: accuracy
    proxy_metrics:
      - correct_prob_per_char
      - normalized_choice_probability
      - correct_vs_best_incorrect_logprob_margin
      - accuracy
    note: accuracy 作为已知较弱的对照指标；前三项必须逐项比较，不能看过 target 后混合取最好值
    benchmarks:
      - name: mmlu-pro
        role: primary
        status: planned
      - name: gpqa-diamond
        role: primary
        status: planned_gated
      - name: gpqa
        role: overlap_diagnostic
        status: diagnostic_only
      - name: mmmlu
        role: primary_multilingual
        status: planned
      - name: mmlu-cf
        role: clean_control
        status: planned
      - name: mmlu
        role: contaminated_sanity_control
        status: diagnostic_only
      - name: c-eval
        role: zh_diagnostic
        status: diagnostic_only
      - name: cmmlu
        role: zh_diagnostic
        status: diagnostic_only
      - name: cmb
        role: zh_medical_diagnostic
        status: diagnostic_only

  math_generation:
    ability: 数学答案生成和多步推理
    wave: 2
    target_metric: generated_final_answer_exact_match
    proxy_metrics:
      - final_answer_logprob_per_char
      - reference_solution_logprob_per_token
      - generated_final_answer_exact_match
    note: >-
      参考解答似然可能只测措辞熟悉度，必须和答案似然、最终生成准确率分别报告；
      如果 20M/60M 出现地板效应，从 150M 开始也不算失败。
    benchmarks:
      - name: math
        role: primary
        status: planned
      - name: mgsm
        role: primary_multilingual
        status: planned_after_multilingual_subsets
      - name: gsm1k
        role: clean_control
        status: blocked_missing_dataset
      - name: gsm-plus
        role: perturbation_control
        status: planned
      - name: gsm8k
        role: contaminated_sanity_control
        status: diagnostic_only

  code_generation:
    ability: Python 函数级代码生成
    wave: 2
    target_metric: execution_pass_at_1
    proxy_metrics:
      - reference_solution_logprob_per_token
      - correct_vs_behavioral_mutant_logprob_margin
      - generated_compile_rate
      - execution_pass_at_1
    note: >-
      单一参考答案似然会惩罚其他正确写法，不能独立晋级；行为错误但语法正确的 mutant
      margin 和真实执行通过率必须同时参加校准。
    benchmarks:
      - name: evalplus
        role: primary
        status: planned
      - name: livecodebench
        role: temporal_clean_primary
        status: blocked_missing_data_id
      - name: lbpp
        role: clean_control
        status: planned
      - name: mhpp
        role: clean_control
        status: planned
      - name: humaneval
        role: contaminated_sanity_control
        status: diagnostic_only
      - name: mbpp
        role: contaminated_sanity_control
        status: diagnostic_only

excluded_from_pretraining_proxy:
  reason: 注册表声明为 SFT-only，或者指标依赖指令跟随/Judge，不能直接由基础小模型代理
  benchmarks:
    - name: ifeval
      status: blocked
      requirement: 固定且相同的 post-training bridge 后重新设计实验
    - name: aime-2025
      status: blocked
      requirement: 若要评价 base 能力，先修改其 stage contract 并建立生成评测协议
    - name: math-500
      status: blocked
      requirement: 若要评价 base 能力，先修改其 stage contract
    - name: simpleqa-verified
      status: blocked
      requirement: 建立 base-compatible 的答案似然目标，或固定 post-training bridge
    - name: simpleqa
      status: blocked
      requirement: 建立 base-compatible 的答案似然目标，或固定 post-training bridge
    - name: livebench
      status: blocked
      requirement: Judge 与 post-training 效果无法和预训练数据影响直接分离
    - name: aime-2024
      status: blocked
      requirement: 若要评价 base 能力，先修改其 stage contract
    - name: mt-bench
      status: blocked
      requirement: 固定 post-training 和 Judge 后另立实验
    - name: arena-hard
      status: blocked
      requirement: 固定 post-training 和 Judge 后另立实验

reporting:
  required_per_benchmark:
    - target_scores_by_recipe_and_seed
    - proxy_scores_by_scale_recipe_and_seed
    - all_candidate_metrics_including_failed_metrics
    - decisive_and_ambiguous_target_pairs
    - pairwise_accuracy_and_cluster_bootstrap_ci
    - abstention_coverage_and_conditional_accuracy
    - heldout_family_results
    - contamination_audit_revision
    - compute_and_wall_time
  forbidden:
    - 跨能力总体质量分
    - 只报告表现最好的 proxy 指标
    - 把相互重叠的数据集当成独立证据
    - 把公开 checkpoint 复评写成本地训练复现
