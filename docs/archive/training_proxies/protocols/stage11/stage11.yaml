# Stage 11: tiny-proxy trainability evaluation.
# All compared corpora share one tokenizer and identical training budgets.

input:
  format: auto
  field_map: {}
  batch_size: 500

sampling:
  max_docs_per_corpus: 5000
  mode: random
  seed: 42
  validation_fraction: 0.2
  split_seed: 42

tokenizer:
  vocab_size: 4096
  min_frequency: 2
  max_chars_per_corpus: 10000000

model:
  context_length: 256
  primary:
    d_model: 256
    n_layers: 4
    n_heads: 4
    ffn_multiplier: 4
  # Research profiles for conditioning scale calibration. They are opt-in via
  # --primary-model and do not change the default 4M-parameter protocol.
  conditioning_20m:
    d_model: 512
    n_layers: 6
    n_heads: 8
    ffn_multiplier: 4
  conditioning_60m:
    d_model: 768
    n_layers: 8
    n_heads: 12
    ffn_multiplier: 4
  conditioning_125m:
    d_model: 768
    n_layers: 17
    n_heads: 12
    ffn_multiplier: 4
  scale_small:
    d_model: 128
    n_layers: 2
    n_heads: 4
    ffn_multiplier: 4

training:
  steps: 600
  checkpoints: [50, 100, 200, 400, 600]
  batch_size: 16
  learning_rate: 0.0005
  min_learning_rate_ratio: 0.1
  warmup_steps: 20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  max_train_tokens_per_corpus: 10000000
  seeds: [17, 29, 41]

evaluation:
  max_tokens_per_doc: 2048
  batch_size: 32
  bootstrap_samples: 2000
  confidence: 0.95
  conditioning_min_effect_bits: 0.01
  scaling_min_effect_bits: 0.01
  stable_horizon_fraction: 0.8

runtime:
  device: auto
  torch_num_threads: 4

output:
  base_dir: outputs/stage11
