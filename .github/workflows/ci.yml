name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest pytest-cov jsonschema ruff click pyyaml numpy pyarrow xxhash
          # Research data-advisor tests exercise CPU torch utilities and the HF snapshot resolver;
          # do not install the full GPU/model extra set in the ordinary CI gate.
          python -m pip install huggingface_hub
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: make check
