# Exact FineWeb filtering-recipe comparison: unfiltered annotation pool vs >=3.

input:
  format: jsonl
  field_map: {}
  batch_size: 500

sampling:
  max_docs_per_corpus: 40000
  mode: head
  seed: 42
  validation_fraction: 0.02
  split_seed: 42

tokenizer:
  vocab_size: 4096
  min_frequency: 2
  max_chars_per_corpus: 30000000

model:
  context_length: 256
  primary:
    d_model: 256
    n_layers: 4
    n_heads: 4
    ffn_multiplier: 4
  conditioning_20m:
    d_model: 512
    n_layers: 6
    n_heads: 8
    ffn_multiplier: 4
  conditioning_60m:
    d_model: 768
    n_layers: 8
    n_heads: 12
    ffn_multiplier: 4
  conditioning_125m:
    d_model: 768
    n_layers: 17
    n_heads: 12
    ffn_multiplier: 4
  scale_small:
    d_model: 128
    n_layers: 2
    n_heads: 4
    ffn_multiplier: 4

training:
  steps: 4883
  checkpoints: [250, 500, 1000, 2500, 4883]
  batch_size: 16
  learning_rate: 0.0003
  min_learning_rate_ratio: 0.1
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  max_train_tokens_per_corpus: 50000000
  seeds: [17]

evaluation:
  max_tokens_per_doc: 512
  batch_size: 32
  bootstrap_samples: 1000
  confidence: 0.95
  conditioning_min_effect_bits: 0.01
  scaling_min_effect_bits: 0.01
  stable_horizon_fraction: 0.8

runtime:
  device: auto
  torch_num_threads: 4

output:
  base_dir: outputs/stage11_conditioning_threshold
