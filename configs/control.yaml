# 控制组对照验证统一配置
# control_positive (OpenWebText) vs control_negative (raw CC)，各 1000 条 JSONL，标准 schema。
# 各 stage 子命令读自己的段；input 段共享（jsonl，无 field_map——文件已是 doc_id/text/source/language）。

input:
  format: jsonl
  field_map: {}
  path_meta: {}

# ── S1 stats ──
tokenizer:
  backend: hf
  path: /mnt/public/model/huggingface/Qwen3-4B-Base
stats:
  percentiles: [25, 50, 75, 90, 95, 99]

# ── S2 pii / secrets ──
pii:
  language: en
  entities: []
  score_threshold: 0.5
  spacy_model: en_core_web_sm   # 本 env 无 lg
secrets:
  gitleaks_bin: gitleaks

# ── S3 langid / quality / extraction ──
langid:
  model_path: /mnt/public/model/lid.176.bin
  top_k: 3
  confidence_threshold: 0.7
quality:                        # Gopher Quality + C4（英文语料，c4 适用）
  filters:
    - gopher_quality
    - c4_quality
extraction:
  short_stub_chars: 50
  html_tag_min_count: 3
  html_entity_min_count: 1
  boilerplate_edge_ratio: 0.05
  boilerplate_edge_min_chars: 200
  boilerplate_middle_weight: 0.2
  boilerplate_weighted_threshold: 2.0
  risk_score_threshold: 2.0

# ── S4 exact / minhash / ngram ──
exact:
  paragraph_sep: "\n\n"
  min_para_chars: 50
minhash:
  num_hashes: 64
  ngram_size: 5
  jaccard_threshold: 0.8
  num_bands: 8
  band_size: 8
  hot_bucket_cap: 1000
ngram:
  ngram_size: 13
  overlap_threshold: 0.5

# ── S10 tokenize ──
tokenize:
  tokenizer_path: /mnt/public/model/huggingface/Qwen3-4B-Base
  unk_threshold: 0.01
  fertility_threshold: 5.0
  batch_size: 256
