# Stage 1: 来源审计 + 时间属性
# 当前配置针对 Ultra-FineWeb-L3（Parquet 格式，字段 uid/content/style）

input:
  format: parquet
  batch_size: 500          # 每批读取行数（1GB 文件，流式处理）
  field_map:               # 字段重命名：数据集字段 -> 标准字段
    uid: doc_id
    content: text
    # style 保留在 meta.style（无需映射）
  path_meta:               # 从路径片段推断字段值（首个匹配生效）
    language:
      ultrafineweb_en_l3: en
      ultrafineweb_zh_l3: zh
    source:
      multi_style: ultrafineweb_multi_style
      qa: ultrafineweb_qa
  # glob: "*.parquet"      # 目录模式下的文件匹配模式（默认 *.parquet）

# ── 对于 JSONL 格式（如 mock 数据），将 input 改为：
# input:
#   format: jsonl
#   field_map: {}
#   path_meta: {}

tokenizer:
  backend: hf              # hf（默认，使用 HF Tokenizers）| words（空格分词，仅 mock smoke 用，对 CJK 严重失真）
  path: /mnt/public/model/huggingface/Qwen3-4B-Base    # backend=hf 时填本地 tokenizer.json/模型目录/hub 名
  # 注：与 stage10 共享同一 tokenizer，跑 `stats --coalesce-stage10` 可一次扫描产两份 summary
  # 注：token 数 = Qwen3 BPE token 数（不是 words），length_buckets 4K/8K/.../256K+ 因此是 token 桶

stats:
  percentiles: [25, 50, 75, 90, 95, 99]

license:
  timeout_per_doc: 30      # ScanCode 每文档超时秒数
  max_docs: null           # null = 扫描全部；整数可限制数量（调试用）

output:
  base_dir: outputs/stage1
