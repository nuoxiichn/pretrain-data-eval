# The Stack (dedup) 代码数据集输入配置
# 数据: /mnt/public/data/the-stack-dedup/data/<lang>/*.parquet
# 用途: 给代码维度 (S8 parsability / S2 code-PII / S2 secrets / S1 stats) 喂真实代码语料

input:
  format: parquet
  batch_size: 500
  field_map:
    hexsha: doc_id
    content: text
  path_meta:
    source:
      the-stack-dedup: the_stack_dedup

pii:
  language: en
  entities: []
  score_threshold: 0.5
  spacy_model: en_core_web_sm   # 本 env 仅装 sm；lg 不可用（离线，GitHub 下载被墙）

secrets:
  gitleaks_bin: gitleaks

# 代码污染检测：对比 EvalPlus（HumanEval/MBPP）Python 解答
benchmarks:
  cache_dir: /mnt/public/data
  datasets:
    - {path: /mnt/public/data/contamination_v3_benchmarks/eval_aligned/evalplus.jsonl, text_field: question, code_field: code, label: evalplus}

code_near:
  ngram_size: 5
  jaccard_threshold: 0.85
  num_hashes: 128
  num_bands: 16
  band_size: 8

code_ast:
  languages:
    - python
  fingerprint_jaccard_threshold: 0.90
