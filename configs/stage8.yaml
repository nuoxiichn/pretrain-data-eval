# Stage 8: 专项能力

input:
  format: parquet
  batch_size: 500
  field_map:
    uid: doc_id
    content: text
  path_meta:
    language:
      ultrafineweb_en_l3: en
      ultrafineweb_zh_l3: zh
    source:
      multi_style: ultrafineweb_multi_style
      qa: ultrafineweb_qa

parsability:
  language: python

stem:
  model_path: /mnt/public/model/EssentialAI/eai-distill-0.5b
  batch_size: 8
  max_input_chars: 30000       # 超长文本走 beginning/middle/end 拼接
  max_new_tokens: 100
  device: null                 # null = auto (cuda if available, else cpu)
  high_difficulty_threshold: 4  # reasoning_depth >= 该值视为 high_difficulty

output:
  base_dir: outputs/stage8
