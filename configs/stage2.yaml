# Stage 2: 安全隐私检测

input:
  format: parquet
  batch_size: 500
  field_map:
    uid: doc_id
    content: text
  path_meta:
    language:
      ultrafineweb_en_l3: en
      ultrafineweb_zh_l3: zh
    source:
      multi_style: ultrafineweb_multi_style
      qa: ultrafineweb_qa

pii:
  language: en
  entities: []               # [] = 用内置默认实体集（已剔除 driver/medical/uk_nhs 等高误报类）；
                             # 如需自定义，显式列出实体名，会完全覆盖默认集
  score_threshold: 0.5
  spacy_model: en_core_web_lg   # 可改为绝对路径，如 /mnt/public/model/en_core_web_lg
  # 注：命中后自动过滤示例/占位符（example.com 邮箱、保留/私有 IP 等），
  #     被过滤数记入 summary.filtered_placeholder_count

secrets:
  gitleaks_bin: gitleaks     # gitleaks 二进制路径或命令名

toxicity:
  model_path: /mnt/public/data/models/xlmr-large-toxicity-classifier
                             # 支持两类模型，自动识别：
                             #   多标签（detoxify unbiased RoBERTa）→ sigmoid，7 维打分
                             #   二分类（xlmr-large-toxicity-classifier 等）→ softmax，单维 toxicity
                             # 备选英文 7 维：/mnt/public/model/detoxify/unbiased-toxic-roberta
                             # 切换时改此路径即可，无需改代码。
  high_risk_threshold: 0.5   # toxicity 维度超过此值视为高风险
  batch_size: 16             # 推理批大小

toxicity_v3:                 # v3：chunk 切分 + XLM-R 召回 + Qwen LLM-judge
  recall_model_path: /mnt/public/data/models/xlmr-large-toxicity-classifier
  judge_model_path: /mnt/public/model/huggingface/Qwen2.5-7B-Instruct
  chunk_size: 512            # XLM-R tokenizer 子词数；超过截断/切块
  chunk_overlap: 64          # 相邻 chunk 重叠子词数，避免句子被切断
  recall_threshold: 0.5      # chunk 维度 XLM-R toxicity ≥ 此值进入 LLM 复审
  recall_batch_size: 16
  judge_max_tokens: 256      # judge 输出 JSON 上限
  judge_temperature: 0.0     # 复审稳定性优先
  judge_gpu_mem_util: 0.85   # vLLM gpu_memory_utilization；与召回模型共卡时手动调低
  judge_max_chunks_per_doc: 8  # 单文档最多送审 chunk 数（按 XLM-R 分数倒序），防极端长文档拖慢

output:
  base_dir: outputs/stage2
